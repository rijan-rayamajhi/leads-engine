# Lead Engine crawler config. Override city at runtime: pipeline.py --once --city "Pokhara, Nepal"

city: "Kathmandu, Nepal"        # default; pick any location at run time with --city

# Google Places categories to scan (union of local + health + retail + food/hospitality)
categories:
  - restaurant
  - cafe
  - hotel
  - travel agency
  - retail store
  - boutique
  - clinic
  - dentist
  - salon
  - gym

# Services you sell -> the tags the Judge maps leads to
services:
  - website
  - chatbot
  - whatsapp_bot
  - ai_phone
  - mobile_app
  - custom_software


# LLM batching + per-run cap. Fewer, bigger calls stay under the free-tier
# request quota; the cap keeps one run inside the 30-min CI window and leaves
# the rest for the next cron (every 6h). Raise batch_size for fewer calls,
# lower it if a model truncates long JSON.
llm:
  batch_size: 15        # leads classified/pitched per LLM call
  max_per_run: 200      # most leads to send to the LLM in one run

thresholds:            # intent_score buckets
  hot: 90
  warm: 70
  qualified: 50

source_weights:        # tuned by the feedback loop over time
  google_reviews: 1.0

freshness_ttl_days: 30

# Region for phone numbers that arrive without a +country code (ISO 3166-1).
# Must match the market in `city`, or valid local numbers get flagged invalid.
# Retargeting the city means changing this too: IN for India, NP for Nepal.
phone_region: NP

# How long a website health verdict stays fresh. The cron runs every 6h; without
# this every run would re-fetch a few hundred homepages for no new information.
site_check_ttl_days: 14

# Secrets come from environment, never this file:
#   DATABASE_URL GOOGLE_PLACES_KEY OPENROUTER_API_KEY
#   OPENROUTER_API_KEY_2 (optional 2nd key; used once the 1st key's quota runs out)
