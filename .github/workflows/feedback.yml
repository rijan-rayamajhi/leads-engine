name: feedback
on:
  schedule:
    - cron: "0 2 * * *"     # nightly 02:00 UTC
  workflow_dispatch:

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # commit the retuned weights overlay
    defaults:
      run:
        working-directory: crawler
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retune source weights from outcomes
        run: python feedback.py
      - name: Commit updated weights (if changed)
        run: |
          git config user.name  "lead-engine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add weights.json
          git commit -m "chore: retune source weights [skip ci]" || echo "no change"
          git push || echo "nothing to push"
